# 패키징/인스톨러 설정 (ADR-006, directory-structure §4)
# 1차 타깃: Windows 10/11 x64, NSIS 인스톨러.
appId: com.agtfinder.app
productName: AGT-Finder
copyright: Copyright © 2026 AGT-Finder Team

directories:
  output: dist
  buildResources: resources

# electron-vite 산출물(out/) 만 패키징에 포함. sourcemap(.map)은 배포 제외(P7).
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

asar: true
# §Y1: 셸 verb 워커 ps1 은 PowerShell -File 이 asar 가상경로를 못 읽으므로 asar 외부로
# 풀어둔다(app.asar.unpacked/out/main/shellVerbsWorker.ps1). shellVerbs.ts 가
# __dirname → app.asar.unpacked 보정으로 경로를 해석한다(HashManager workerPath 선례).
asarUnpack:
  - '**/shellVerbsWorker.ps1'
  - '**/shellNewWorker.ps1'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # 코드 서명(P7 준비): 인증서는 환경변수로 주입한다(저장소 커밋 금지).
  #   CSC_LINK=<.pfx 경로 또는 base64>   CSC_KEY_PASSWORD=<인증서 암호>
  # electron-builder 가 CSC_* 를 자동 인식한다. 미설정 시 미서명 빌드(경고만, 빌드 성공).
  # 실제 서명은 유효한 코드서명 인증서(.pfx)가 필요하다 → 사용자/CI 환경에서 수행.
  signingHashAlgorithms:
    - sha256
  # 타임스탬프 서버(서명 시 적용). 인증서 준비 후 주석 해제.
  # rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AGT-Finder
  # 탐색기 우클릭 "AGT-Finder로 열기" 등록(V2). customInstall/customUnInstall 매크로로
  # HKCU\Software\Classes 에 폴더·배경·드라이브·파일 메뉴를 설치/제거한다(UTF-8 BOM).
  include: resources/installer.nsh

# 자동 업데이트 게시(P7) — GitHub Releases. electron-builder 가 릴리스에 인스톨러와
# 함께 latest.yml/*.blockmap 을 업로드하고, app-update.yml 을 패키지에 번들한다.
# 비공개 리포면 실행 환경에 GH_TOKEN(또는 GITHUB_TOKEN) 필요. 게시는 `npm run release`.
publish:
  - provider: github
    owner: SimJaeSugn
    repo: AGT-Explorer
    # 게시 즉시 published 상태로 공개(draft 단계 생략) → 자동 업데이트가 바로 인식.
    # 게시 전 검토가 필요하면 draft 로 되돌린다.
    releaseType: release
