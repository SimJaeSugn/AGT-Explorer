<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 엄격 CSP — 로컬 번들만. 런타임에도 Main 의 onHeadersReceived 가 동일 정책을 강제한다. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGT-Finder</title>
    <style>
      /* 전역 리셋: 풀 높이 셸을 위해 html/body/#root 높이 100% + 기본 마진 제거. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /*
       * 전역 스크롤바 스타일 (Chromium/Electron).
       * 색은 테마 CSS 변수(--c-*, applyTheme 가 :root 에 주입)를 참조해
       * 라이트/다크에 자동 연동한다. applyTheme 실행 전 초기 페인트 대비 폴백값 동봉.
       * thumb 의 투명 테두리 + background-clip:padding-box 로 얇은 알약형 여백을 만든다.
       */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--c-border-strong, #c4cad2);
        border-radius: 8px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--c-text-muted, #6a737d);
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: var(--c-accent, #2563eb);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /*
       * 키보드 포커스 표시 (WCAG 2.4.7 Focus Visible) — P7-A 접근성.
       * :focus-visible 은 키보드 탐색(Tab/화살표) 시에만 매칭되고 마우스 클릭에는
       * 매칭되지 않으므로, 키보드 사용자에게만 가시 포커스 링을 준다. 색은 테마
       * accent CSS 변수(applyTheme 주입)를 따라 라이트/다크/블루라이트에 연동.
       * 인라인 outline:'none' 을 가진 인터랙티브 요소들은 P7 에서 제거해 이 규칙이
       * 적용되도록 했다(인라인 스타일은 CSS 를 이기므로 가시성 보장 목적).
       */
      :focus-visible {
        outline: 2px solid var(--c-accent, #2563eb);
        outline-offset: 1px;
      }
      /* 마우스 포커스(:focus 이지만 :focus-visible 아님)에는 링 미표시. */
      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
